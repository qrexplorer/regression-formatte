<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Clipboard Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
    }

    #pasteBox {
      border: 3px dashed #888;
      min-height: 200px;
      padding: 30px;
      border-radius: 10px;
      background: #f7f7f7;
      outline: none;
    }

    #pasteBox:focus {
      border-color: #222;
      background: white;
    }

    #debug {
      margin-top: 20px;
      padding: 20px;
      background: #eee;
      white-space: pre-wrap;
      font-family: monospace;
    }

    img {
      max-width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<h1>Clipboard Test</h1>

<p>
  Click inside the box below, then copy something from Stata
  and press <strong>Ctrl+V</strong>.
</p>

<div id="pasteBox"
     contenteditable="true"
     tabindex="0">
  Click here, then press Ctrl+V
</div>

<div id="debug">
Waiting for paste...
</div>

<img id="imagePreview">

<script>

const pasteBox =
  document.getElementById("pasteBox");

const debug =
  document.getElementById("debug");

const imagePreview =
  document.getElementById("imagePreview");


pasteBox.addEventListener(
  "paste",
  function(event) {

    event.preventDefault();

    const clipboard =
      event.clipboardData;

    const types =
      Array.from(clipboard.types);

    let output =
      "PASTE EVENT RECEIVED!\n\n";

    output +=
      "Clipboard types:\n";

    output +=
      types.join("\n");

    output += "\n\n";


    // TEXT

    const plainText =
      clipboard.getData("text/plain");

    const html =
      clipboard.getData("text/html");


    if (plainText) {

      output +=
        "TEXT FOUND:\n\n";

      output +=
        plainText;

      pasteBox.innerText =
        plainText;

    }

    else if (html) {

      output +=
        "HTML FOUND:\n\n";

      output +=
        html.substring(0, 1000);

      const temp =
        document.createElement("div");

      temp.innerHTML =
        html;

      pasteBox.innerText =
        temp.innerText;

    }


    // IMAGES

    for (const item of clipboard.items) {

      output +=
        "\n\nItem: " +
        item.type;

      if (
        item.type.startsWith("image/")
      ) {

        const file =
          item.getAsFile();

        const url =
          URL.createObjectURL(file);

        imagePreview.src =
          url;

        output +=
          "\nIMAGE FOUND!";
      }

    }


    debug.textContent =
      output;

  }
);


// Automatically focus paste area

window.addEventListener(
  "load",
  function() {

    pasteBox.focus();

  }
);

</script>

</body>
</html>
